            padding: 20px;
            
            /* Le regole per centrare perfettamente tutto nello schermo */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centra verticalmente */
            min-height: 95vh;
        }

        .container {
            max-width: 600px;
            background: #fffdf7;
            padding: 30px;
            border: 2px solid #8b5a2b;
            border-radius: 8px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
            
            /* Animazione fluida quando il blocco cambia dimensione per il sigillo */
            transition: all 0.4s ease-in-out;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #5c1818;
            margin-top: 0;
        }

        button {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #5c1818;
            color: #f4e8d3;
            border: 2px solid #2c1a16;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            margin: 20px 0;
            transition: 0.3s;
        }

        button:hover {
            background-color: #8b2b2b;
        }

        #risultato {
            font-size: 1.3rem;
            line-height: 1.6;
            min-height: 100px;
            margin-top: 20px;
            padding: 15px;
            border-top: 1px dashed #8b5a2b;
            font-style: italic;
        }

        .sezione-sigillo {
            margin-top: 20px;
            display: none; 
        }

        .sezione-sigillo p {
            font-family: 'Cinzel', serif;
            font-weight: bold;
            color: #5c1818;
            font-size: 1.1rem;
        }

        .immagine-tomo {
            max-width: 150px;
            border-radius: 50%; 
            background-color: #e8dcc4;
            border: 4px solid #8b5a2b;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
            padding: 10px;
        }
