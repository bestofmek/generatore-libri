    <style>

        .copia-btn:hover {

        }
        .copia-btn svg { width: 14px; height: 14px; fill: currentColor; }

        /* STORICO COMPATTATO */
        .sezione-storico {
            margin-top: 15px;

        .sezione-storico h3 {

        #storicoLista {

        #storicoLista::-webkit-scrollbar { width: 6px; }

        #storicoLista::-webkit-scrollbar-thumb { background: rgba(139, 90, 43, 0.4); border-radius: 4px; }

        .storico-item {

        .nav-back {

<body>
    <div class="container">
        <h1>Archivio delle Reliquie</h1>
        <p>Oggetti sacri, corrotti o dimenticati pronti per la tua campagna.</p>
        
        <button class="genera-btn" onclick="generaReliquia()">Rivela una Reliquia</button>
        
        <!-- Riquadro risultato principale -->
        <div id="risultato">I manufatti stanno riaffiorando dalla polvere...</div>
        
        <!-- Immagine del Sigillo (Manteniamo lo spazio per mantenere l'html uguale, anche se possiamo nasconderlo) -->

        <!-- Riquadro Storico -->

        <!-- Footer con Crediti e Bottone Ko-fi -->

                Ti ho salvato la sessione? Offrimi un caffè! ☕
            </a>

    </div>

    <script>
        const tipi = ["La Spada", "L'Anello", "Il Calice"];
    const aggettivi = ["Sussurrante", "di Vetro Nero", "Cremisi"];
    const exProprietari = ["dei Re Sepolti", "del Falso Profeta", "dell'Architetto Pazzo"];
    const descrizioniVisive = [
      "Emana un debole bagliore malato se lasciato al buio.", 
      "Le ombre proiettate da questo oggetto sembrano sempre leggermente sbagliate."
    ];
    const maledizioni = [
      "Chi lo porta sogna in loop il proprio funerale ogni notte.", 
      "Rende il portatore paranoico e morbosamente geloso dell'oggetto stesso."
    ];

    let storicoTomi = [];

    function scegliCasuale(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

    function hashString(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
        }
        return h >>> 0;
    }

    function createPRNG(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            let t = Math.imul(s ^ (s >>> 15), 1 | s);
            t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    function getColorByAggettivo(agg) {
        const a = agg.toLowerCase();
        if (a.includes("cremisi") || a.includes("insanguinato")) return "#a83232";
        if (a.includes("ghiaccio")) return "#5dade2";
        if (a.includes("luce") || a.includes("vetro") || a.includes("cieco")) return "#4a4e52";
        if (a.includes("ruggine") || a.includes("cenere") || a.includes("ossa")) return "#c08354";
        if (a.includes("profanato") || a.includes("infranto")) return "#6b8e23";
        if (a.includes("sussurrante") || a.includes("silente") || a.includes("velato") || a.includes("dimenticato")) return "#8e44ad";
        return "#8b5a2b";
    }

    function buildRelicSVG(tipo, aggettivo, seedText) {
        const seed = hashString(seedText);
        const rand = createPRNG(seed);
        const color = getColorByAggettivo(aggettivo);

        let defs = `
          <defs>
            <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="0.8" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
        `;

        let iconSVG = "";
        switch(tipo) {
            case "La Spada":
                iconSVG += `<path d="M96 30 L104 30 L104 120 L96 120 Z" />`;
                iconSVG += `<polygon points="100 10, 106 30, 94 30" />`;
                iconSVG += `<rect x="70" y="120" width="60" height="8" rx="4"/>`;
                iconSVG += `<rect x="94" y="128" width="12" height="40" />`;
                iconSVG += `<circle cx="100" cy="172" r="8" />`;
                break;
            case "L'Anello":
                iconSVG += `<circle cx="100" cy="110" r="45" stroke-width="6"/>`;
                iconSVG += `<circle cx="100" cy="110" r="35" stroke-width="2"/>`;
                iconSVG += `<polygon points="100 45, 120 65, 100 75, 80 65" stroke-width="3"/>`;
                break;
            case "Il Calice":
                iconSVG += `<path d="M60 40 Q60 120 100 120 Q140 120 140 40 Z" stroke-width="4"/>`;
                iconSVG += `<line x1="60" y1="40" x2="140" y2="40" stroke-width="4"/>`;
                iconSVG += `<line x1="100" y1="120" x2="100" y2="170" stroke-width="6"/>`;
                iconSVG += `<path d="M70 180 Q100 160 130 180 Z" stroke-width="4"/>`;
                break;
            case "La Corona":
                iconSVG += `<path d="M40 140 L160 140 L160 160 L40 160 Z" stroke-width="4"/>`;
                iconSVG += `<path d="M40 140 L30 60 L70 100 L100 40 L130 100 L170 60 L160 140 Z" stroke-width="4"/>`;
                iconSVG += `<circle cx="100" cy="40" r="5" />`;
                iconSVG += `<circle cx="30" cy="60" r="5" /><circle cx="170" cy="60" r="5" />`;
                break;
            case "La Maschera":
                iconSVG += `<ellipse cx="100" cy="100" rx="55" ry="75" stroke-width="4"/>`;
                iconSVG += `<ellipse cx="80" cy="90" rx="12" ry="8" stroke-width="2"/>`;
                iconSVG += `<ellipse cx="120" cy="90" rx="12" ry="8" stroke-width="2"/>`;
                iconSVG += `<path d="M100 25 L100 175" stroke-width="2" stroke-dasharray="4 4"/>`;
                iconSVG += `<path d="M85 140 Q100 150 115 140" stroke-width="2"/>`;
                break;
            case "L'Amuleto":
                iconSVG += `<path d="M100 20 L40 90 L100 20 L160 90" stroke-width="3" stroke-dasharray="6 6"/>`;
                iconSVG += `<circle cx="100" cy="120" r="40" stroke-width="4"/>`;
                iconSVG += `<polygon points="100 90, 120 120, 100 150, 80 120" stroke-width="2"/>`;
                break;
            case "Il Manto":
                iconSVG += `<path d="M80 40 Q100 20 120 40 Q150 150 150 170 Q100 150 50 170 Q50 150 80 40 Z" stroke-width="4"/>`;
                iconSVG += `<path d="M100 40 L100 160" stroke-width="2" opacity="0.5"/>`;
                iconSVG += `<circle cx="100" cy="45" r="8" stroke-width="3"/>`;
                break;
            case "Il Pugnale":
                iconSVG += `<path d="M92 60 L108 60 L103 120 L97 120 Z" />`;
                iconSVG += `<polygon points="100 30, 108 60, 92 60" />`;
                iconSVG += `<rect x="75" y="120" width="50" height="6" rx="3"/>`;
                iconSVG += `<rect x="94" y="126" width="12" height="30" />`;
                iconSVG += `<polygon points="100 165, 105 156, 95 156" />`;
                break;
            case "L'Occhio":
                iconSVG += `<path d="M30 100 Q100 30 170 100 Q100 170 30 100 Z" stroke-width="4"/>`;
                iconSVG += `<circle cx="100" cy="100" r="30" stroke-width="3"/>`;
                iconSVG += `<circle cx="100" cy="100" r="10" fill="currentColor"/>`;
                break;
            case "Il Sigillo":
                iconSVG += `<circle cx="100" cy="100" r="55" stroke-width="4"/>`;
                iconSVG += `<circle cx="100" cy="100" r="45" stroke-width="2"/>`;
                iconSVG += `<polygon points="100 55, 139 122, 61 122" stroke-width="2"/>`;
                iconSVG += `<polygon points="100 145, 139 78, 61 78" stroke-width="2"/>`;
                break;
            case "Il Bastone":
                iconSVG += `<rect x="94" y="60" width="12" height="120" rx="6" stroke-width="3"/>`;
                iconSVG += `<circle cx="100" cy="40" r="20" stroke-width="4"/>`;
                iconSVG += `<circle cx="100" cy="40" r="8" fill="currentColor" opacity="0.5"/>`;
                break;
            case "Lo Specchio":
                iconSVG += `<ellipse cx="100" cy="90" rx="45" ry="60" stroke-width="5"/>`;
                iconSVG += `<ellipse cx="100" cy="90" rx="35" ry="50" stroke-width="2"/>`;
                iconSVG += `<rect x="90" y="150" width="20" height="40" rx="4"/>`;
                iconSVG += `<line x1="80" y1="120" x2="120" y2="60" stroke-width="2" opacity="0.5"/>`;
                iconSVG += `<line x1="95" y1="130" x2="130" y2="85" stroke-width="2" opacity="0.5"/>`;
                break;
            case "Il Reliquiario":
                iconSVG += `<rect x="50" y="70" width="100" height="90" rx="5" stroke-width="4"/>`;
                iconSVG += `<rect x="65" y="85" width="70" height="60" stroke-width="2"/>`;
                iconSVG += `<path d="M50 70 L100 30 L150 70 Z" stroke-width="4"/>`;
                iconSVG += `<circle cx="100" cy="115" r="15" stroke-width="2"/>`;
                iconSVG += `<circle cx="100" cy="115" r="5" fill="currentColor"/>`;
                break;
            case "L'Armatura":
                iconSVG += `<path d="M60 40 L140 40 L150 80 Q100 180 100 180 Q50 80 60 40 Z" stroke-width="4"/>`;
                iconSVG += `<path d="M60 40 Q100 60 140 40" stroke-width="2"/>`;
                iconSVG += `<line x1="100" y1="50" x2="100" y2="160" stroke-width="2" opacity="0.6"/>`;
                iconSVG += `<path d="M70 90 Q100 110 130 90" stroke-width="2" opacity="0.6"/>`;
                break;
            case "La Lanterna":
                iconSVG += `<polygon points="70 70, 130 70, 140 150, 60 150" stroke-width="4"/>`;
                iconSVG += `<rect x="80" y="40" width="40" height="30" stroke-width="3"/>`;
                iconSVG += `<path d="M100 40 Q130 10 130 40" stroke-width="3" fill="none"/>`;
                iconSVG += `<line x1="100" y1="70" x2="100" y2="150" stroke-width="3"/>`;
                iconSVG += `<circle cx="100" cy="110" r="15" fill="currentColor" opacity="0.6"/>`;
                break;
            case "La Clessidra":
                iconSVG += `<rect x="50" y="20" width="100" height="15" rx="4" stroke-width="3"/>`;
                iconSVG += `<rect x="50" y="165" width="100" height="15" rx="4" stroke-width="3"/>`;
                iconSVG += `<polygon points="65 35, 135 35, 100 100" stroke-width="3"/>`;
                iconSVG += `<polygon points="100 100, 135 165, 65 165" stroke-width="3"/>`;
                iconSVG += `<line x1="60" y1="35" x2="60" y2="165" stroke-width="4"/>`;
                iconSVG += `<line x1="140" y1="35" x2="140" y2="165" stroke-width="4"/>`;
                iconSVG += `<polygon points="85 165, 115 165, 100 120" fill="currentColor" opacity="0.7"/>`;
                iconSVG += `<line x1="100" y1="100" x2="100" y2="120" stroke-width="2"/>`;
                break;
            default:
                iconSVG += `<circle cx="100" cy="100" r="50" stroke-width="3"/>`;
        }

        let scintille = "";
        for (let i = 0; i < 15; i++) {
            const px = 20 + rand() * 160;
            const py = 20 + rand() * 160;
            const ps = 1 + rand() * 2.5;
            scintille += `<circle cx="${px}" cy="${py}" r="${ps}" fill="${color}" opacity="${0.2 + rand() * 0.4}"/>`;
        }

        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-label="Reliquia" role="img">
            ${defs}
            ${scintille}
            <g fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
              ${iconSVG}
            </g>
          </svg>
        `.trim();

        return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    // Funzione sicura per rimuovere i tag HTML senza confondere VS Code
    function pulisciTestoDaHTML(testoSporco) {
        let div = document.createElement("div");
        div.innerHTML = testoSporco;
        return div.textContent || div.innerText || "";
    }

    function generaReliquia() {
        controllaPopup();
        const tipo = scegliCasuale(tipi);
        const aggettivo = scegliCasuale(aggettivi);
        const exProprietario = scegliCasuale(exProprietari);
        const nomeCompleto = `${tipo} ${aggettivo} ${exProprietario}`;
        
        const aspetto = scegliCasuale(descrizioniVisive);
        const maledizione = scegliCasuale(maledizioni);

        const testoCompleto = `Hai rinvenuto "<strong>${nomeCompleto}</strong>". ${aspetto} Maledizione: ${maledizione}`;
        document.getElementById('risultato').innerHTML = testoCompleto;

        const testoPulito = pulisciTestoDaHTML(testoCompleto);
        const seed = `${nomeCompleto}|${aspetto}|${maledizione}`;
        const svgDataUri = buildRelicSVG(tipo, aggettivo, seed);
        const fileName = `reliquia-${tipo.toLowerCase().replace(/[' ]/g, '')}.svg`;
        
        // Creazione HTML sicura (nessun evento inline)
        document.getElementById('areaBottoneCopiaPrincipale').innerHTML = `
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button id="bottoneCopiaPrincipale" class="copia-btn">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Copia Reliquia
                </button>
                <a href="${svgDataUri}" download="${fileName}" class="copia-btn" style="text-decoration: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Scarica Immagine
                </a>
            </div>
        `;

        // Associo l'evento di copia in modo sicuro tramite Javascript puro
        document.getElementById('bottoneCopiaPrincipale').addEventListener('click', function() {
            copiaTesto(testoPulito);
        });

        const sezioneSigillo = document.getElementById('sezioneSigillo');
        const imgElement = document.getElementById('immagineGenerata');

        imgElement.src = svgDataUri;
        imgElement.alt = `Aspetto della reliquia ${nomeCompleto}`;
        
        document.querySelector('.sezione-sigillo p').textContent = "Aspetto dell'oggetto:";
        sezioneSigillo.style.display = "block";

        aggiungiAStorico(testoCompleto, tipo, aggettivo, seed);
    }

    function aggiungiAStorico(nuovoTesto, tipo, aggettivo, seed) {
        storicoTomi.unshift({ testo: nuovoTesto, tipo: tipo, aggettivo: aggettivo, seed: seed });
        if (storicoTomi.length > 4) {
            storicoTomi.pop();
        }
        aggiornaInterfacciaStorico();
    }

    function aggiornaInterfacciaStorico() {
        const sezioneStorico = document.getElementById('sezioneStorico');
        const storicoLista = document.getElementById('storicoLista');

        storicoLista.innerHTML = "";

        if (storicoTomi.length > 1) {
            sezioneStorico.style.display = "block";

            for (let i = 1; i < storicoTomi.length; i++) {
                const data = storicoTomi[i];
                const itemDiv = document.createElement('div');
                itemDiv.className = 'storico-item';
                
                const miniImg = buildRelicSVG(data.tipo, data.aggettivo, data.seed);
                const testoSenzaTag = pulisciTestoDaHTML(data.testo);

                // Creiamo l'elemento senza eventi inline
                itemDiv.innerHTML = `
                    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 5px;">
                        <img src="${miniImg}" style="width: 32px; height: 32px; background: radial-gradient(circle, #f7f0e2 0%, #eadcc1 70%, #ddc8a3 100%); border-radius: 50%; border: 1px solid #8b5a2b; padding: 2px;">
                        <div style="flex: 1;">${data.testo}</div>
                    </div>
                    <button class="copia-btn btn-storico-copia" style="float:right; margin-top:5px;">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        Copia
                    </button>
                    <div style="clear:both;"></div>
                `;
                
                // Agganciamo l'evento copia in modo sicuro
                const btn = itemDiv.querySelector('.btn-storico-copia');
                btn.addEventListener('click', function() {
                    copiaTesto(testoSenzaTag);
                });

                storicoLista.appendChild(itemDiv);
            }
        } else {
            sezioneStorico.style.display = "none";
        }
    }

    function copiaTesto(testo) {
        navigator.clipboard.writeText(testo).then(() => {
            alert("Reliquia copiata negli appunti! Pronta da incollare in chat.");
        }).catch(() => {
            alert("Copia non riuscita su questo browser.");
        });
    }

    // --- SISTEMA DI MONETIZZAZIONE (Popup dopo 5 click per sessione/ogni 2 ore) ---
    function controllaPopup() {
        const ORA_ATTUALE = new Date().getTime();
        const DUE_ORE_IN_MS = 2 * 60 * 60 * 1000; // 2 ore espresse in millisecondi
        
        let count = parseInt(localStorage.getItem('arcane_gen_count')) || 0;
        let tempoInizio = parseInt(localStorage.getItem('arcane_gen_time')) || 0;

        // Se non c'è un tempo di inizio o sono passate più di 2 ore, resettiamo tutto
        if (tempoInizio === 0 || (ORA_ATTUALE - tempoInizio) > DUE_ORE_IN_MS) {
            count = 0;
            localStorage.setItem('arcane_gen_time', ORA_ATTUALE);
        }

        count++;
        localStorage.setItem('arcane_gen_count', count);

        // Appare solo al 5° click della sessione corrente (2 ore)
        if (count === 5) {
            mostraPopupKofi();
        }
    }
