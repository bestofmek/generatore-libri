    <script>
    const titoli = [
        { testo: "Trattato sulle Aberrazioni Minori", magico: true },
        { testo: "Il Grimorio Senza Nome", magico: true },
        { testo: "Diario di Bordo del Capitano Arcus", magico: false }
    ];
    const aspetti = [
        "È rilegato in muta di serpente",
        "È foderato in velluto rosso che sembra assorbire la luce",
        "Le pagine emanano un suono simile a foglie calpestate"
    ];
    const dettagli = [
        "Il libro puzza fortemente di umidità e terra smossa.",
        "Se lo tieni aperto troppo a lungo, le mosche iniziano ad accumularsi.",
        "Mentre lo sfogli, senti il vago sapore di acqua di mare in gola."
    ];
    const segreti = [
        "Vale almeno 50 monete d'oro per un collezionista eccentrico.",
        "Tra le pagine c'è una lettera di ricatto indirizzata all'attuale Sindaco.",
        "Rivela il punto debole di una bestia che il gruppo dovrà affrontare presto."
    ];

let storicoTomi = [];

function scegliCasuale(lista) {
    return lista[Math.floor(Math.random() * lista.length)];
}

function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return h >>> 0;
}

function createPRNG(seed) {
    let s = seed >>> 0;
    return function () {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function polar(cx, cy, r, a) {
    const rad = (a - 90) * Math.PI / 180;
    return {
        x: cx + r * Math.cos(rad),
        y: cy + r * Math.sin(rad)
    };
}

function polygonPoints(cx, cy, r, sides, rotation = 0) {
    const pts = [];
    for (let i = 0; i < sides; i++) {
        const a = rotation + (360 / sides) * i;
        const p = polar(cx, cy, r, a);
        pts.push(`${p.x.toFixed(2)},${p.y.toFixed(2)}`);
    }
    return pts.join(" ");
}

function starPath(cx, cy, outerR, innerR, points, rotation = 0) {
    let d = "";
    for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = rotation + (360 / (points * 2)) * i;
        const p = polar(cx, cy, r, a);
        d += (i === 0 ? "M" : "L") + p.x.toFixed(2) + " " + p.y.toFixed(2) + " ";
    }
    return d + "Z";
}

function line(x1, y1, x2, y2, extra = "") {
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${extra}/>`;
}

function circle(cx, cy, r, extra = "") {
    return `<circle cx="${cx}" cy="${cy}" r="${r}" ${extra}/>`;
}

function path(d, extra = "") {
    return `<path d="${d}" ${extra}/>`;
}

function polyline(points, extra = "") {
    return `<polyline points="${points}" ${extra}/>`;
}

function polygon(points, extra = "") {
    return `<polygon points="${points}" ${extra}/>`;
}

function addRadialMarks(rand, count, r1, r2, strokeWidth = 1.2) {
    let out = "";
    for (let i = 0; i < count; i++) {
        const jitter = (rand() - 0.5) * 6;
        const a = (360 / count) * i + jitter;
        const p1 = polar(100, 100, r1, a);
        const p2 = polar(100, 100, r2, a);
        out += line(p1.x, p1.y, p2.x, p2.y, `stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" opacity="0.8"`);
    }
    return out;
}

function addDots(rand, count, r, sizeMin = 1.5, sizeMax = 3.2) {
    let out = "";
    for (let i = 0; i < count; i++) {
        const a = (360 / count) * i + (rand() - 0.5) * 8;
        const p = polar(100, 100, r, a);
        const s = sizeMin + rand() * (sizeMax - sizeMin);
        out += circle(p.x, p.y, s, `fill="currentColor" opacity="${0.55 + rand() * 0.3}"`);
    }
    return out;
}

function addTriangles(rand, count, r, size = 7, outward = true) {
    let out = "";
    for (let i = 0; i < count; i++) {
        const a = (360 / count) * i;
        const tip = polar(100, 100, r + (outward ? size : -size), a);
        const l = polar(100, 100, r, a - 5);
        const rr = polar(100, 100, r, a + 5);
        out += polygon(
            `${tip.x.toFixed(2)},${tip.y.toFixed(2)} ${l.x.toFixed(2)},${l.y.toFixed(2)} ${rr.x.toFixed(2)},${rr.y.toFixed(2)}`,
            `fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"`
        );
    }
    return out;
}

function addRuneTicks(rand, count, r) {
    let out = "";
    for (let i = 0; i < count; i++) {
        const a = (360 / count) * i;
        const p1 = polar(100, 100, r - 3, a);
        const p2 = polar(100, 100, r + 3, a);
        out += line(p1.x, p1.y, p2.x, p2.y, `stroke="currentColor" stroke-width="1" opacity="0.75"`);
        if (rand() > 0.5) {
            const branch = polar(100, 100, r, a + 6);
            out += line(branch.x, branch.y, p2.x, p2.y, `stroke="currentColor" stroke-width="0.9" opacity="0.5"`);
        }
    }
    return out;
}

function buildSigilSVG(seedText) {
    const seed = hashString(seedText);
    const rand = createPRNG(seed);
    const archetype = seed % 10;
    const rotation = Math.floor(rand() * 360);
    const rings = 2 + Math.floor(rand() * 2);
    const density = 6 + Math.floor(rand() * 7);

    let shapes = "";
    let defs = `
      <defs>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="0.6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
    `;

    for (let i = 0; i < rings; i++) {
        const r = 68 - i * 10;
        const opacity = 0.9 - i * 0.18;
        shapes += circle(100, 100, r, `fill="none" stroke="currentColor" stroke-width="${i === 0 ? 2 : 1.2}" opacity="${opacity}"`);
    }

    shapes += addRuneTicks(rand, 12 + Math.floor(rand() * 8), 61);
    shapes += addDots(rand, 8 + density, 52, 1.1, 2.6);

    switch (archetype) {
        case 0: {
            shapes += path(starPath(100, 100, 48, 20, 5, rotation), `fill="none" stroke="currentColor" stroke-width="2" opacity="0.9"`);
            shapes += circle(100, 100, 10, `fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.8"`);
            shapes += addTriangles(rand, 5, 69, 8, true);
            break;
        }
        case 1: {
            shapes += path(`M70 112 Q100 60 130 112 Q100 145 70 112 Z`, `fill="none" stroke="currentColor" stroke-width="2" opacity="0.9"`);
            shapes += circle(100, 104, 10, `fill="none" stroke="currentColor" stroke-width="1.8"`);
            shapes += circle(100, 104, 3.5, `fill="currentColor" opacity="0.85"`);
            shapes += addRadialMarks(rand, 8, 70, 79, 1.3);
            break;
        }
        case 2: {
            shapes += polygon(polygonPoints(100, 100, 42, 3, rotation), `fill="none" stroke="currentColor" stroke-width="2" opacity="0.9"`);
            shapes += polygon(polygonPoints(100, 100, 22, 3, rotation + 180), `fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"`);
            shapes += line(100, 58, 100, 142, `stroke="currentColor" stroke-width="1.2" opacity="0.7"`);
            shapes += addTriangles(rand, 6, 70, 6, true);
            break;
        }
        case 3: {
            const petals = 8;
            for (let i = 0; i < petals; i++) {
                const a = rotation + (360 / petals) * i;
                const p1 = polar(100, 100, 18, a - 10);
                const p2 = polar(100, 100, 42, a);
                const p3 = polar(100, 100, 18, a + 10);
                shapes += path(`M100 100 L${p1.x.toFixed(2)} ${p1.y.toFixed(2)} Q${p2.x.toFixed(2)} ${p2.y.toFixed(2)} ${p3.x.toFixed(2)} ${p3.y.toFixed(2)} Z`, `fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.82"`);
            }
            shapes += circle(100, 100, 14, `fill="none" stroke="currentColor" stroke-width="1.3"`);
            break;
        }
        case 4: {
            shapes += circle(100, 100, 26, `fill="none" stroke="currentColor" stroke-width="2" opacity="0.95"`);
            shapes += addRadialMarks(rand, 16, 30, 48, 1.5);
            shapes += addTriangles(rand, 8, 70, 7, true);
            shapes += circle(100, 100, 5, `fill="currentColor" opacity="0.85"`);
            break;
        }
        case 5: {
            const stars = 6 + Math.floor(rand() * 4);
            let points = [];
            for (let i = 0; i < stars; i++) {
                const p = polar(100, 100, 36 + rand() * 18, rotation + (360 / stars) * i);
                points.push(p);
                shapes += circle(p.x, p.y, 2, `fill="currentColor" opacity="0.8"`);
            }
            for (let i = 0; i < points.length; i++) {
                const next = points[(i + 2) % points.length];
                shapes += line(points[i].x, points[i].y, next.x, next.y, `stroke="currentColor" stroke-width="1.1" opacity="0.6"`);
            }
            shapes += circle(100, 100, 8, `fill="none" stroke="currentColor" stroke-width="1.2"`);
            break;
        }
        case 6: {
            const sides = 6;
            shapes += polygon(polygonPoints(100, 100, 38, sides, rotation), `fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.9"`);
            shapes += polygon(polygonPoints(100, 100, 24, sides, rotation + 30), `fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"`);
            for (let i = 0; i < sides; i++) {
                const a = rotation + (360 / sides) * i;
                const p1 = polar(100, 100, 24, a);
                const p2 = polar(100, 100, 38, a + 30);
                shapes += line(p1.x, p1.y, p2.x, p2.y, `stroke="currentColor" stroke-width="1" opacity="0.65"`);
            }
            shapes += addDots(rand, 6, 14, 1.5, 2.4);
            break;
        }
        case 7: {
            shapes += path(starPath(100, 100, 44, 30, 8, rotation), `fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.78"`);
            shapes += addTriangles(rand, 8, 72, 10, true);
            shapes += addRadialMarks(rand, 8, 18, 58, 1.4);
            shapes += circle(100, 100, 12, `fill="none" stroke="currentColor" stroke-width="1.5"`);
            break;
        }
        case 8: {
            shapes += path(`M64 116 Q100 50 136 116`, `fill="none" stroke="currentColor" stroke-width="2" opacity="0.9"`);
            shapes += path(`M74 120 Q100 74 126 120`, `fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.75"`);
            shapes += circle(100, 90, 8, `fill="none" stroke="currentColor" stroke-width="1.4"`);
            shapes += line(100, 98, 100, 132, `stroke="currentColor" stroke-width="1.4" opacity="0.75"`);
            shapes += addDots(rand, 10, 56, 1.2, 2.5);
            break;
        }
        case 9: {
            shapes += line(100, 58, 100, 142, `stroke="currentColor" stroke-width="2" opacity="0.9"`);
            shapes += line(58, 100, 142, 100, `stroke="currentColor" stroke-width="2" opacity="0.9"`);
            shapes += circle(100, 100, 24, `fill="none" stroke="currentColor" stroke-width="1.4"`);
            shapes += path(starPath(100, 100, 16, 7, 4, rotation + 45), `fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.8"`);
            shapes += addRadialMarks(rand, 4, 62, 76, 1.5);
            break;
        }
    }

    if (rand() > 0.45) {
        const innerPoints = 4 + Math.floor(rand() * 4);
        shapes += polygon(polygonPoints(100, 100, 12 + rand() * 10, innerPoints, rotation / 2), `fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.55"`);
    }

    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-label="Sigillo arcano" role="img">
        ${defs}
        <g fill="none" stroke="#6e4a2d" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
          ${shapes}
        </g>
      </svg>
    `.trim();

    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

    // Funzione sicura per rimuovere i tag HTML

        let div = document.createElement("div");
        div.innerHTML = testoSporco;
        return div.textContent || div.innerText || "";
    }

    function generaLibro() {
        controllaPopup();
        const titoloObj = scegliCasuale(titoli);
        const aspetto = scegliCasuale(aspetti);
        const dettaglio = scegliCasuale(dettagli);
        const segreto = scegliCasuale(segreti);

        const rigaMagica = titoloObj.magico ? " <em>(Emana un'aura magica)</em>" : "";
        const testoCompleto = `Hai trovato "<strong>${titoloObj.testo}</strong>"${rigaMagica}. ${aspetto}. ${dettaglio} <strong>Segreto:</strong> ${segreto}`;
        
        document.getElementById('risultato').innerHTML = testoCompleto;

        // Prepariamo l'immagine SVG
        const svgURI = buildSigilSVG(testoCompleto);
        const testoPulito = pulisciTestoDaHTML(testoCompleto);

        // Creiamo i due bottoni (Copia e Scarica)
        document.getElementById('areaBottoneCopiaPrincipale').innerHTML = `
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button id="bottoneCopiaTomo" class="copia-btn">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Copia Tomo
                </button>
                <a href="${svgURI}" download="sigillo-tomo.svg" class="copia-btn" style="text-decoration: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Scarica Sigillo
                </a>
            </div>
        `;

        // Aggiungiamo l'evento copia in modo sicuro
        document.getElementById('bottoneCopiaTomo').addEventListener('click', function() {
            copiaTesto(testoPulito);
        });

        const sezioneSigillo = document.getElementById('sezioneSigillo');
        const imgElement = document.getElementById('immagineGenerata');

        imgElement.src = svgURI;
        sezioneSigillo.style.display = "block";

        // Aggiungiamo allo storico (salviamo l'HTML e il seed/SVG per poterlo ricreare)
        storicoTomi.unshift({
            html: testoCompleto,
            pulito: testoPulito,
            svg: svgURI
        });

        if (storicoTomi.length > 4) {
            storicoTomi.pop();
        }

        aggiornaInterfacciaStorico();
    }

    function aggiornaInterfacciaStorico() {
        const sezioneStorico = document.getElementById('sezioneStorico');
        const storicoLista = document.getElementById('storicoLista');

        storicoLista.innerHTML = "";

        if (storicoTomi.length > 1) {
            sezioneStorico.style.display = "block";

            for (let i = 1; i < storicoTomi.length; i++) {
                const item = storicoTomi[i];
                const itemDiv = document.createElement('div');
                itemDiv.className = 'storico-item';

                // Usiamo anche per i tomi la mini-preview visiva nello storico!
                itemDiv.innerHTML = `
                    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 5px;">
                        <img src="${item.svg}" style="width: 32px; height: 32px; background: radial-gradient(circle, #f7f0e2 0%, #eadcc1 70%, #ddc8a3 100%); border-radius: 50%; border: 1px solid #8b5a2b; padding: 2px;">
                        <div style="flex: 1;">${item.html}</div>
                    </div>
                    <button class="copia-btn btn-storico-copia" style="float:right; margin-top:5px;">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        Copia
                    </button>
                    <div style="clear:both;"></div>
                `;

                // Aggiungiamo l'evento in modo sicuro
                const btn = itemDiv.querySelector('.btn-storico-copia');
                btn.addEventListener('click', function() {
                    copiaTesto(item.pulito);
                });

                storicoLista.appendChild(itemDiv);
            }
        } else {
            sezioneStorico.style.display = "none";
        }
    }

    function copiaTesto(testo) {
        navigator.clipboard.writeText(testo).then(() => {
            alert("Tomo copiato negli appunti! Pronto da incollare in chat.");
        }).catch(() => {
            alert("Copia non riuscita su questo browser.");
        });
    }

        // --- SISTEMA DI MONETIZZAZIONE (Popup dopo 5 click globali) ---
    function controllaPopup() {
        // Legge quante generazioni ha fatto l'utente in tutto l'hub
        let count = parseInt(localStorage.getItem('arcane_gen_count')) || 0;
        count++;
        localStorage.setItem('arcane_gen_count', count);

        // Appare solo esattamente al 5° click
        if (count === 5) {
            mostraPopupKofi();
        }
    }

        overlay.id = "kofi-overlay";
        overlay.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; display:flex; justify-content:center; align-items:center; backdrop-filter: blur(3px);";
        
        overlay.innerHTML = `
            <div style="background:#fffdf7; padding:40px 30px; border:2px solid #8b5a2b; border-radius:8px; max-width:450px; text-align:center; box-shadow:0 15px 40px rgba(0,0,0,0.4); margin:20px;">
                <h2 style="font-family:'Cinzel', serif; color:#5c1818; margin-top:0; font-size:1.8rem;">Stai trovando tesori incredibili! 🧙‍♂️</h2>
                <p style="font-family:'Crimson Text', serif; font-size:1.15rem; line-height:1.5; color:#2c1a16;">Quello che stai usando è solo un "assaggio" gratuito, le combinazioni si esauriranno in fretta.</p>
                <p style="font-family:'Crimson Text', serif; font-size:1.15rem; line-height:1.5; color:#2c1a16;">Se ti sta piacendo il progetto e vuoi darmi una mano a creare le versioni Premium illimitate (con migliaia di risultati), considerami per un caffè!</p>
                <a href="https://ko-fi.com/bestofmek" target="_blank" style="display:inline-block; margin-top:15px; padding:12px 24px; background-color:#8b5a2b; color:#fffdf7; text-decoration:none; font-family:'Cinzel', serif; font-size:1.1rem; border-radius:4px; transition:0.3s; font-weight:bold;">☕ Offrimi un Caffè</a>
                <br><br>
                <button onclick="document.getElementById('kofi-overlay').remove()" style="background:transparent; border:none; color:#72563e; text-decoration:underline; cursor:pointer; font-family:'Crimson Text', serif; font-size:1rem; margin-top:10px;">Chiudi e continua a esplorare</button>
            </div>
        `;
        document.body.appendChild(overlay);
    }
    </script>

</body>
