        #storicoLista::-webkit-scrollbar { width: 6px; }
        #storicoLista::-webkit-scrollbar-track { background: #fdfaf3; border-radius: 4px; }
        #storicoLista::-webkit-scrollbar-thumb { background: rgba(139, 90, 43, 0.4); border-radius: 4px; }

        .kofi-btn:hover {

</head>
<body>
    <div class="container">
        <h1>Cartografo Arcano</h1>
        <p>Genera spunti tattici ed esplorativi per le tue mappe.</p>
        
        <button class="genera-btn" onclick="generaMappa()">Traccia la Mappa</button>
        
        <div id="risultato">In attesa di tracciare nuove coordinate...</div>
        
        <div id="sezioneSigillo" class="sezione-sigillo">
            <p>Simbolo Cartografico:</p>
            <img id="immagineGenerata" class="immagine-tomo" src="" alt="Icona Mappa">
        </div>

        <div id="areaBottoneCopiaPrincipale"></div>

        <div id="sezioneStorico" class="sezione-storico">
            <h3>Ultime 3 Mappe Esplorate</h3>
            <div id="storicoLista"></div>
        </div>

        <a href="../index.html" class="nav-back">← Torna all'Hub</a>

        <div class="footer-crediti">
            <p>© 2026 - Castato dalla mente di <strong>bestofmek</strong></p>
            <a href="https://ko-fi.com/bestofmek" target="_blank" class="kofi-btn">
                Ti ho salvato la sessione? Offrimi un caffè! ☕
            </a>
        </div>
    </div>

    <script>
    const luoghi = ["La Cripta", "L'Osservatorio", "Le Rovine"];
    const stati = ["Sommerso", "di Cristallo", "Corrotto"];
    const ostacoli = [
        "L'intero pavimento è inclinato di 30 gradi e scivoloso.",
        "L'illuminazione cambia colore ciclicamente, invertendo la gravità."
    ];
    const sorprese = [
        "Al centro troneggia l'enorme scheletro di una creatura mai vista.",
        "Un obelisco emette un debole ronzio che fa vibrare le armi di metallo."
    ];

    let storicoTomi = [];

    function scegliCasuale(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

    function hashString(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
        return h >>> 0;
    }

    function createPRNG(seed) {
        let s = seed >>> 0;
        return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            let t = Math.imul(s ^ (s >>> 15), 1 | s);
            t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    function getColorByStato(stato) {
        const s = stato.toLowerCase();
        if (s.includes("sommerso") || s.includes("acqua")) return "#2980b9"; 
        if (s.includes("fiamme") || s.includes("magma")) return "#c0392b"; 
        if (s.includes("spore") || s.includes("corrotto")) return "#27ae60"; 
        if (s.includes("ghiaccio") || s.includes("cristallo")) return "#85c1e9";
        if (s.includes("ossidiana") || s.includes("vuoto")) return "#34495e";
        if (s.includes("meccanico") || s.includes("forgia")) return "#d35400";
        return "#8b5a2b"; 
    }

    // Costruisce la grafica vettoriale di una Bussola/Rosa dei Venti o Mappa stilizzata
    function buildMapSVG(luogo, stato, seedText) {
        const seed = hashString(seedText);
        const rand = createPRNG(seed);
        const color = getColorByStato(stato);

        let defs = `
          <defs>
            <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="0.8" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                <rect width="20" height="20" fill="none" stroke="${color}" stroke-width="0.5" opacity="0.3"/>
            </pattern>
          </defs>
        `;

        let iconSVG = `<rect x="10" y="10" width="180" height="180" fill="url(#grid)" rx="90" opacity="0.5"/>`;
        iconSVG += `<circle cx="100" cy="100" r="90" stroke-width="3"/>`;
        iconSVG += `<circle cx="100" cy="100" r="80" stroke-width="1.5" stroke-dasharray="4 4"/>`;

        // Bussola centrale (Rosa dei Venti) procedurale
        const style = seed % 3;
        if(style === 0) {
            // Classica
            iconSVG += `<polygon points="100 20, 115 100, 100 180, 85 100" fill="none" stroke-width="2"/>`;
            iconSVG += `<polygon points="20 100, 100 115, 180 100, 100 85" fill="none" stroke-width="2"/>`;
            iconSVG += `<circle cx="100" cy="100" r="10" fill="${color}" opacity="0.6"/>`;
        } else if (style === 1) {
            // Runica/Esoterica
            iconSVG += `<path d="M100 30 L100 170 M30 100 L170 100" stroke-width="2"/>`;
            iconSVG += `<path d="M50 50 L150 150 M50 150 L150 50" stroke-width="1.5" opacity="0.7"/>`;
            iconSVG += `<circle cx="100" cy="100" r="25" stroke-width="2"/>`;
            iconSVG += `<polygon points="100 75, 125 100, 100 125, 75 100" stroke-width="2"/>`;
        } else {
            // Mappa del tesoro
            iconSVG += `<path d="M40 160 Q80 120 120 160 T160 40" stroke-width="3" stroke-dasharray="6 6"/>`;
            iconSVG += `<path d="M150 30 L170 50 M170 30 L150 50" stroke-width="4"/>`; // La X segna il punto
        }

        // Elementi topografici casuali (Montagne, Foreste)
        for (let i = 0; i < 4 + Math.floor(rand() * 4); i++) {
            const px = 40 + rand() * 120;
            const py = 40 + rand() * 120;
            if(rand() > 0.5) {
                iconSVG += `<path d="M${px} ${py} L${px+10} ${py-15} L${px+20} ${py}" stroke-width="1.5"/>`; // Montagna
            } else {
                iconSVG += `<circle cx="${px}" cy="${py}" r="5" stroke-width="1.5"/>`; // Albero
                iconSVG += `<line x1="${px}" y1="${py+5}" x2="${px}" y2="${py+12}" stroke-width="1.5"/>`;
            }
        }

        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-label="Mappa" role="img">
            ${defs}
            <g fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
              ${iconSVG}
            </g>
          </svg>
        `.trim();

        return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    function pulisciTestoDaHTML(testoSporco) {
        let div = document.createElement("div");
        div.innerHTML = testoSporco;
        return div.textContent || div.innerText || "";
    }

    function generaMappa() {
        // Grammatica: adatta i finali se serve. Esempio semplificato.
        controllaPopup();
        const luogo = scegliCasuale(luoghi);
        const stato = scegliCasuale(stati);
        let titoloFinale = `${luogo} ${stato}`;
        
        // Correzione grammaticale rapida (es. "La Caverna" + "Sommerso" -> "Sommersa")
        if (luogo.endsWith("a") && stato.endsWith("o")) { titoloFinale = `${luogo} ${stato.slice(0, -1)}a`; }
        if (luogo.endsWith("e") && stato.endsWith("o")) { titoloFinale = `${luogo} ${stato.slice(0, -1)}e`; }

        const ostacolo = scegliCasuale(ostacoli);
        const sorpresa = scegliCasuale(sorprese);

        const testoCompleto = `Hai trovato "<strong>${titoloFinale}</strong>". <br><br><strong>Ambiente:</strong> ${ostacolo} <br><strong>Punto d'Interesse:</strong> ${sorpresa}`;
        
        document.getElementById('risultato').innerHTML = testoCompleto;

        const testoPulito = pulisciTestoDaHTML(testoCompleto);
        const seed = `${titoloFinale}|${ostacolo}|${sorpresa}`;
        const svgDataUri = buildMapSVG(luogo, stato, seed);
        const fileName = `mappa-${luogo.toLowerCase().replace(/[' ]/g, '')}.svg`;
        
        document.getElementById('areaBottoneCopiaPrincipale').innerHTML = `
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button id="bottoneCopiaPrincipale" class="copia-btn">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Copia Appunti
                </button>
                <a href="${svgDataUri}" download="${fileName}" class="copia-btn" style="text-decoration: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Scarica Mappa
                </a>
            </div>
        `;

        document.getElementById('bottoneCopiaPrincipale').addEventListener('click', function() {
            copiaTesto(testoPulito);
        });

        const sezioneSigillo = document.getElementById('sezioneSigillo');
        const imgElement = document.getElementById('immagineGenerata');

        imgElement.src = svgDataUri;
        sezioneSigillo.style.display = "block";

        aggiungiAStorico(testoCompleto, luogo, stato, seed);
    }

    function aggiungiAStorico(nuovoTesto, luogo, stato, seed) {
        storicoTomi.unshift({ testo: nuovoTesto, luogo: luogo, stato: stato, seed: seed });
        if (storicoTomi.length > 4) { storicoTomi.pop(); }
        aggiornaInterfacciaStorico();
    }

    function aggiornaInterfacciaStorico() {
        const sezioneStorico = document.getElementById('sezioneStorico');
        const storicoLista = document.getElementById('storicoLista');

        storicoLista.innerHTML = "";

        if (storicoTomi.length > 1) {
            sezioneStorico.style.display = "block";

            for (let i = 1; i < storicoTomi.length; i++) {
                const data = storicoTomi[i];
                const itemDiv = document.createElement('div');
                itemDiv.className = 'storico-item';
                
                const miniImg = buildMapSVG(data.luogo, data.stato, data.seed);
                const testoSenzaTag = pulisciTestoDaHTML(data.testo);

                itemDiv.innerHTML = `
                    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 5px;">
                        <img src="${miniImg}" style="width: 32px; height: 32px; background: radial-gradient(circle, #f7f0e2 0%, #eadcc1 70%, #ddc8a3 100%); border-radius: 50%; border: 1px solid #8b5a2b; padding: 2px;">
                        <div style="flex: 1; font-size: 0.9rem;">${data.testo}</div>
                    </div>
                    <button class="copia-btn btn-storico-copia" style="float:right; margin-top:5px; padding: 2px 8px;">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        Copia
                    </button>
                    <div style="clear:both;"></div>
                `;
                
                const btn = itemDiv.querySelector('.btn-storico-copia');
                btn.addEventListener('click', function() { copiaTesto(testoSenzaTag); });

                storicoLista.appendChild(itemDiv);
            }
        } else {
            sezioneStorico.style.display = "none";
        }
    }

    function copiaTesto(testo) {
        navigator.clipboard.writeText(testo).then(() => {
            alert("Appunti della mappa copiati! Pronti da incollare.");
        }).catch(() => {
            alert("Copia non riuscita su questo browser.");
        });
    }

        // --- SISTEMA DI MONETIZZAZIONE (Popup dopo 5 click globali) ---
    function controllaPopup() {
        // Legge quante generazioni ha fatto l'utente in tutto l'hub
        let count = parseInt(localStorage.getItem('arcane_gen_count')) || 0;
        count++;
        localStorage.setItem('arcane_gen_count', count);

        // Appare solo esattamente al 5° click
        if (count === 5) {
            mostraPopupKofi();
        }
    }

    function mostraPopupKofi() {
        const overlay = document.createElement('div');
        overlay.id = "kofi-overlay";
        overlay.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; display:flex; justify-content:center; align-items:center; backdrop-filter: blur(3px);";
        
        overlay.innerHTML = `
            <div style="background:#fffdf7; padding:40px 30px; border:2px solid #8b5a2b; border-radius:8px; max-width:450px; text-align:center; box-shadow:0 15px 40px rgba(0,0,0,0.4); margin:20px;">
                <h2 style="font-family:'Cinzel', serif; color:#5c1818; margin-top:0; font-size:1.8rem;">Stai trovando tesori incredibili! 🧙‍♂️</h2>
                <p style="font-family:'Crimson Text', serif; font-size:1.15rem; line-height:1.5; color:#2c1a16;">Quello che stai usando è solo un "assaggio" gratuito, le combinazioni si esauriranno in fretta.</p>
                <p style="font-family:'Crimson Text', serif; font-size:1.15rem; line-height:1.5; color:#2c1a16;">Se ti sta piacendo il progetto e vuoi darmi una mano a creare le versioni Premium illimitate (con migliaia di risultati), considerami per un caffè!</p>
                <a href="https://ko-fi.com/bestofmek" target="_blank" style="display:inline-block; margin-top:15px; padding:12px 24px; background-color:#8b5a2b; color:#fffdf7; text-decoration:none; font-family:'Cinzel', serif; font-size:1.1rem; border-radius:4px; transition:0.3s; font-weight:bold;">☕ Offrimi un Caffè</a>
                <br><br>
                <button onclick="document.getElementById('kofi-overlay').remove()" style="background:transparent; border:none; color:#72563e; text-decoration:underline; cursor:pointer; font-family:'Crimson Text', serif; font-size:1rem; margin-top:10px;">Chiudi e continua a esplorare</button>
            </div>
        `;
        document.body.appendChild(overlay);
    }
    </script>
</body>
